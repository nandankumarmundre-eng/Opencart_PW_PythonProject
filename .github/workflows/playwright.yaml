name: Playwright Tests
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  playwright:
    name: 'Playwright Tests'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: https://testautomationpractice.blogspot.com/
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check test site URL
        run: |
          curl --silent --show-error --location --output /dev/null --max-time 30 "$PLAYWRIGHT_BASE_URL"
      - name: Run your tests
        run: python -m pytest tests/test_handling_multiple_pages.py --base-url "$PLAYWRIGHT_BASE_URL" -m "not end_to_end"
